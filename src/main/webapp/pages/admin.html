<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 - SuperDriver</title>
    <link rel="stylesheet" href="../css/auth-common.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/admin.js?v=2026062109"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* 背景效果 */
        .particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .aurora {
            position: fixed;
            inset: -20%;
            z-index: 0;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.35;
            mix-blend-mode: screen;
        }
        .aurora-one {
            background: radial-gradient(600px 600px at 10% 10%, rgba(59, 130, 246, 0.4), transparent 60%),
            radial-gradient(500px 500px at 90% 0%, rgba(139, 92, 246, 0.35), transparent 60%);
            animation: floatOne 24s ease-in-out infinite;
        }
        .aurora-two {
            background: radial-gradient(700px 500px at 100% 100%, rgba(16, 185, 129, 0.35), transparent 60%),
            radial-gradient(400px 400px at 0% 80%, rgba(59, 130, 246, 0.3), transparent 60%);
            animation: floatTwo 28s ease-in-out infinite;
        }
        @keyframes floatOne { 0%, 100% { transform: translate3d(0,0,0) rotate(0deg); } 50% { transform: translate3d(-2%, 3%, 0) rotate(2deg); } }
        @keyframes floatTwo { 0%, 100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(3%, -2%, 0) scale(1.05); } }
        /* 布局 */
        .layout {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            backdrop-filter: var(--blur);
            z-index: 100;
        }
        .sidebar-header {
            padding: 28px 24px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .sidebar-header .brand-mark {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
        .sidebar-header .brand-mark span {
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 4px;
            transform: rotate(45deg);
        }
        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sidebar-header p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }
        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-nav a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--primary), var(--primary-2));
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }
        .sidebar-nav a .nav-icon {
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        .sidebar-nav a:hover {
            color: var(--text);
            background: rgba(255,255,255,0.03);
        }
        .sidebar-nav a:hover .nav-icon {
            transform: scale(1.15);
        }
        .sidebar-nav a.active {
            color: var(--text);
            background: rgba(59, 130, 246, 0.12);
        }
        .sidebar-nav a.active::before {
            transform: scaleY(1);
        }
        .sidebar-nav a.active .nav-icon {
            transform: scale(1.1);
        }
        .sidebar-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
        }
        .sidebar-footer button {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.02);
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .sidebar-footer button:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
            transform: translateY(-1px);
        }
        /* 主内容区 */
        .main {
            flex: 1;
            margin-left: 260px;
            padding: 32px 40px;
            position: relative;
            z-index: 1;
        }
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .main-header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--text), var(--muted));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-header .admin-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }
        .main-header .admin-info .avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        /* 内容区块 */
        .section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: var(--blur);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .section.reveal {
            opacity: 1;
            transform: translateY(0);
        }
        .section:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .section-header h3 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* 按钮样式 */
        .btn {
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }
        .btn:hover::after {
            transform: translateX(100%);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-success {
            background: linear-gradient(135deg, var(--accent), #059669);
            color: white;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            color: white;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(239, 68, 68, 0.4);
        }
        .btn-ghost {
            background: rgba(255,255,255,0.05);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text);
            transform: translateY(-2px);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--muted);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(255,255,255,0.02);
        }
        tr {
            transition: all 0.2s ease;
        }
        tbody tr:hover td {
            background: rgba(59, 130, 246, 0.05);
        }
        tbody tr {
            opacity: 0;
            transform: translateX(-10px);
        }
        tbody tr.reveal {
            opacity: 1;
            transform: translateX(0);
        }
        /* 徽章 */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-pending {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.2);
        }
        .badge-approved {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .badge-rejected {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .badge-admin {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .badge-coach {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .badge-student {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        /* Tab 内容切换 */
        .hidden { display: none !important; }
        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }
        .modal {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            width: 460px;
            max-width: 90vw;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
        }
        .modal h3 {
            margin-bottom: 24px;
            font-size: 20px;
            background: linear-gradient(90deg, var(--text), var(--muted));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .modal .form-group {
            margin-bottom: 18px;
        }
        .modal .form-group label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        /* 空状态 */
        .empty-tip {
            grid-column: 1 / -1;
            justify-self: center;
            align-self: center;
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 14px;
        }
        .empty-tip::before {
            content: '📭';
            display: block;
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-tip.loading::before {
            content: '⏳';
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        /* 加载动画 */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 数字动画 */
        .count-up {
            display: inline-block;
        }
        /* 状态徽章 */
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .status-badge.status-approved {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-badge.status-rejected {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        /* 卡片网格布局 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 4px;
        }
        /* 报名审核卡片 */
        .enrollment-card {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .enrollment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .enrollment-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            border-color: rgba(59,130,246,0.3);
        }
        .enrollment-card:hover::before {
            opacity: 1;
        }
        .enrollment-card .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .enrollment-card .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .enrollment-card .student-info {
            flex: 1;
            min-width: 0;
        }
        .enrollment-card .student-name {
            color: #f1f5f9;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .enrollment-card .student-phone {
            color: #64748b;
            font-size: 12px;
        }
        .enrollment-card .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .enrollment-card .info-row:last-child {
            border-bottom: none;
        }
        .enrollment-card .info-label {
            color: #64748b;
            font-size: 12px;
            flex-shrink: 0;
        }
        .enrollment-card .info-value {
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 500;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 60%;
        }
        .enrollment-card .info-value.subject {
            background: rgba(59,130,246,0.15);
            color: #60a5fa;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
        }
        .enrollment-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .enrollment-card .card-actions .btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .enrollment-card .card-actions .btn-approve {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
        }
        .enrollment-card .card-actions .btn-approve:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: scale(1.02);
        }
        .enrollment-card .card-actions .btn-reject {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.3) !important;
        }
        .enrollment-card .card-actions .btn-reject:hover {
            background: rgba(239,68,68,0.25);
        }
        .enrollment-card .status-pending {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(245,158,11,0.15);
            color: #f59e0b;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .enrollment-card {
            opacity: 0;
            transform: translateY(20px);
        }
        .enrollment-card.reveal {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
<canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
<div class="aurora aurora-one" aria-hidden="true"></div>
<div class="aurora aurora-two" aria-hidden="true"></div>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>SuperDriver</h2>
            <p>管理员控制台</p>
        </div>
        <nav class="sidebar-nav">
            <a class="active" onclick="window.showTab('enrollments')">📄 报名审核</a>
            <a onclick="window.showTab('drivingApplications')">📋 练车申请</a>
            <a onclick="window.showTab('bookings')">🚗 练车记录</a>
            <a onclick="window.showTab('staff')">👥 员工管理</a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="window.logout()">退出登录</button>
        </div>
    </aside>

    <main class="main">
        <div class="main-header">
            <h1 id="pageTitle">报名审核</h1>
            <div id="adminName" style="display:flex;align-items:center;gap:10px;font-size:14px;">
                <div class="admin-avatar" id="adminAvatar" style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;text-transform:uppercase;">管</div>
                <div class="admin-info">
                    <span class="admin-role-badge" style="background:rgba(59,130,246,0.15);color:#60a5fa;padding:2px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid rgba(59,130,246,0.2);">管理员</span>
                    <span class="admin-name" id="adminNameText" style="color:#e2e8f0;font-weight:500;margin-left:6px;"></span>
                </div>
                <button onclick="window.logout()" style="padding:6px 16px;border:none;border-radius:8px;background:rgba(239,68,68,0.15);color:#f87171;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;">退出登录</button>
            </div>
        </div>

        <!-- 报名审核 -->
        <div id="tab-enrollments" class="tab-content">
            <div class="section">
                <div class="section-header">
                    <h3>待审核报名</h3>
                    <div style="display:flex;gap:10px;align-items:center;">
                        <span id="pendingCountBadge" style="background:#ef4444;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;display:none;">0 人待审</span>
                        <button class="btn btn-primary btn-sm" onclick="window.loadPendingEnrollments()">刷新</button>
                    </div>
                </div>
                <div id="pendingList" class="card-grid">
                    <div class="empty-tip">加载中...</div>
                </div>
            </div>
            <div class="section">
                <div class="section-header">
                    <h3>所有报名记录</h3>
                    <button class="btn btn-primary btn-sm" onclick="window.loadAllEnrollments()">刷新</button>
                </div>
                <div id="allEnrollmentList">
                    <div class="empty-tip">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 练车申请记录 -->
        <div id="tab-drivingApplications" class="tab-content">
            <div class="section">
                <div class="section-header">
                    <h3>练车申请记录</h3>
                    <div style="display:flex;gap:10px;align-items:center;">
                        <span id="pendingApplicationBadge" style="background:#ef4444;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;display:none;">0 待审核</span>
                        <button class="btn btn-primary btn-sm" onclick="window.loadDrivingApplications()">刷新</button>
                    </div>
                </div>
                <!-- 筛选条件 -->
                <div class="filter-bar" style="margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
                    <input type="text" id="appStudentName" placeholder="搜索学员姓名" style="padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#1e293b;color:#e2e8f0;width:140px;">
                    <select id="appStatus" style="padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#1e293b;color:#e2e8f0;min-width:120px;">
                        <option value="">全部状态</option>
                        <option value="pending">待审核</option>
                        <option value="approved">已批准</option>
                        <option value="rejected">已拒绝</option>
                    </select>
                    <input type="date" id="appStartDate" placeholder="开始日期" style="padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#1e293b;color:#e2e8f0;width:140px;">
                    <span style="color:#64748b;">至</span>
                    <input type="date" id="appEndDate" placeholder="结束日期" style="padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#1e293b;color:#e2e8f0;width:140px;">
                    <button class="btn btn-primary btn-sm" onclick="window.loadDrivingApplications()">搜索</button>
                    <button class="btn btn-secondary btn-sm" onclick="window.clearDrivingApplicationFilters()">重置</button>
                </div>
                <div id="drivingApplicationList">
                    <div class="empty-tip">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 练车记录 -->
        <div id="tab-bookings" class="tab-content">
            <div class="section">
                <div class="section-header">
                    <h3>所有练车记录</h3>
                    <button class="btn btn-primary btn-sm" onclick="window.loadBookings()">刷新</button>
                </div>
                <div id="bookingList">
                    <div class="empty-tip">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 员工管理 -->
        <div id="tab-staff" class="tab-content">
            <div class="section">
                <div class="section-header">
                    <h3>员工列表</h3>
                    <button class="btn btn-primary btn-sm" onclick="window.openAddStaffModal()">+ 新增员工</button>
                </div>
                <div id="staffList">
                    <div class="empty-tip">加载中...</div>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- 新增/编辑员工弹窗 -->
<div class="modal-overlay" id="staffModal">
    <div class="modal">
        <h3 id="staffModalTitle">新增员工</h3>
        <input type="hidden" id="editStaffId">
        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="modalStaffName" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>手机号</label>
            <input type="text" id="modalStaffPhone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label>角色</label>
            <select id="modalStaffRole" onchange="window.toggleSubjectField()">
                <option value="coach">教练</option>
                <option value="admin">管理员</option>
            </select>
        </div>
        <div class="form-group" id="modalSubjectGroup">
            <label>负责科目</label>
            <select id="modalStaffSubject">
                <option value="C1">C1</option>
                <option value="C2">C2</option>
                <option value="C3">C3</option>
            </select>
        </div>
        <div class="form-group" id="modalPasswordGroup">
            <label>密码</label>
            <input type="password" id="modalStaffPassword" placeholder="留空则保持原密码">
        </div>
        <div class="form-group" id="modalUsbGroup">
            <label>USB安全令牌</label>
            <input type="password" id="modalStaffUsb" placeholder="管理员必填，教练可不填">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="window.closeModal()" style="background:rgba(255,255,255,0.1);color:#e2e8f0;">取消</button>
            <button class="btn btn-primary" onclick="window.saveStaff()">保存</button>
        </div>
    </div>
</div>


</body>
</html>
