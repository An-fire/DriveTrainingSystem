<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SuperDriver 智慧驾培平台 - 登录">
    <title>登录 - SuperDriver 智慧驾培</title>
    <link rel="stylesheet" href="../css/auth-common.css">
    <style>
        .page-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .auth-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(15,23,42,0.75);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 32px 28px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 0;
            transform: translateY(16px);
        }
        .auth-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .auth-top {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-top .brand-mini {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .brand-mini .dot {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            display: grid;
            place-items: center;
            box-shadow: 0 8px 24px rgba(59,130,246,0.3);
        }
        .brand-mini .dot span {
            width: 16px;
            height: 16px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.9);
            transform: rotate(15deg);
        }
        .auth-top h1 {
            font-size: 24px;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }
        .auth-top p {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(5,6,10,0.7);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(59,130,246,0.6);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .form-group select option {
            background: #0f172a;
            color: #fff;
        }
        .btn-row {
            margin-top: 12px;
        }
        .sub-note {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.8;
        }
        .sub-note a {
            color: var(--primary);
            font-weight: 600;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
            transition: color .2s;
        }
        .back-link:hover { color: var(--text); }
        #usbGroup { display: none; }
        .btn-block { width: 100%; }

        /* 注册入口样式 */
        .register-prompt {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }
        .register-prompt p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 12px;
        }
        .register-prompt .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .register-prompt .btn-group a {
            padding: 10px 28px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .register-prompt .btn-group a:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .register-prompt .btn-group a.student {
            border-color: rgba(16,185,129,0.3);
        }
        .register-prompt .btn-group a.student:hover {
            background: rgba(16,185,129,0.1);
            border-color: rgba(16,185,129,0.5);
        }
        .register-prompt .btn-group a.staff {
            border-color: rgba(139,92,246,0.3);
        }
        .register-prompt .btn-group a.staff:hover {
            background: rgba(139,92,246,0.1);
            border-color: rgba(139,92,246,0.5);
        }
    </style>
</head>
<body>
<!-- ===== 背景粒子 + 极光（与 home 页面一致） ===== -->
<canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
<div class="aurora aurora-one" aria-hidden="true"></div>
<div class="aurora aurora-two" aria-hidden="true"></div>

<main class="page-shell" style="position:relative;z-index:1;">
    <div class="auth-card" id="authCard">
        <a class="back-link" href="home.html">← 返回首页</a>
        <div class="auth-top">
            <div class="brand-mini">
                <div class="dot"><span></span></div>
                <strong>SuperDriver</strong>
            </div>
            <h1>欢迎回来</h1>
            <p>登录账号继续使用平台服务</p>
        </div>

        <!-- ===== 登录表单 ===== -->
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
                <label>👤 登录角色</label>
                <select id="roleSelect">
                    <option value="student">学员</option>
                    <option value="coach" selected>教练</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <div class="form-group">
                <label>📱 手机号</label>
                <input type="text" id="phone" placeholder="请输入手机号" autocomplete="username" value="13912345678">
            </div>
            <div class="form-group">
                <label>🔒 密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" value="123456">
            </div>
            <div class="form-group" id="usbGroup">
                <label>💾 USB 安全令牌</label>
                <input type="password" id="usbToken" placeholder="输入管理员 USB 令牌 (DRIVE2026)">
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary btn-large btn-block light-sweep">登 录</button>
            </div>
        </form>

        <!-- ===== 新增注册入口 ===== -->
        <div class="register-prompt">
            <p>还没有账号？立即注册</p>
            <div class="btn-group">
                <a href="register-student.html" class="student">👤 学员注册</a>
                <a href="register-staff.html" class="staff">👔 员工注册</a>
            </div>
        </div>
    </div>
</main>

<!-- ===== 引入 home.js 实现粒子动画（与首页一致） ===== -->
<script src="../js/home.js"></script>

<!-- ===== 登录业务逻辑（与之前保持一致） ===== -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../js/common.js"></script>
<script>
    // 角色切换：显示/隐藏 USB 令牌
    document.getElementById('roleSelect').addEventListener('change', function() {
        var usbGroup = document.getElementById('usbGroup');
        usbGroup.style.display = (this.value === 'admin') ? 'block' : 'none';
    });

    function handleLogin() {
        var role = document.getElementById('roleSelect').value;
        var phone = document.getElementById('phone').value.trim();
        var password = document.getElementById('password').value.trim();
        var usbToken = document.getElementById('usbToken').value.trim();

        if (!phone || !password) {
            alert('请填写完整信息');
            return;
        }

        var params = new URLSearchParams();
        params.append('phone', phone);
        params.append('password', password);
        if (role === 'admin') {
            params.append('usbToken', usbToken);
        }

        axios.post(window.BASE_URL + '/login', params.toString(), {
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        })
            .then(function(res) {
                if (res.data.code === 1) {
                    var userInfo = {
                        id: res.data.userId,
                        phone: phone,
                        role: role,
                        name: res.data.name,
                        subject: res.data.subject
                    };
                    localStorage.setItem('userInfo', JSON.stringify(userInfo));
                    window.location.href = res.data.url;
                } else {
                    alert('登录失败：' + (res.data.msg || '未知错误'));
                }
            })
            .catch(function(err) {
                alert('请求异常，请检查网络');
                console.error('登录错误:', err);
            });
    }

    // 回车键触发登录
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });

    // 卡片淡入动画
    setTimeout(function() {
        document.getElementById('authCard').classList.add('visible');
    }, 100);
</script>
</body>
</html>
