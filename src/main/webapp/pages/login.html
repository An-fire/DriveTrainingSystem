<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SuperDriver 智慧驾培平台 - 登录">
    <title>登录 - SuperDriver 智慧驾培</title>
    <link rel="stylesheet" href="../css/auth-common.css">
    <style>
        .page-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .auth-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(15,23,42,0.75);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 32px 28px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
        }
        .auth-top {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-top .brand-mini {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .brand-mini .dot {
            width: 34px; height: 34px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            display: grid; place-items: center;
            box-shadow: 0 8px 24px rgba(59,130,246,0.3);
        }
        .brand-mini .dot span {
            width: 16px; height: 16px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.9);
            transform: rotate(15deg);
        }
        .auth-top h1 {
            font-size: 24px;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }
        .auth-top p {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(5,6,10,0.7);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-group input:focus {
            border-color: rgba(59,130,246,0.6);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .btn-row {
            margin-top: 12px;
        }
        .sub-note {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.8;
        }
        .sub-note a {
            color: var(--primary);
            font-weight: 600;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
            transition: color .2s;
        }
        .back-link:hover { color: var(--text); }
    </style>
</head>
<body>
<canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
<div class="aurora aurora-one" aria-hidden="true"></div>
<div class="aurora aurora-two" aria-hidden="true"></div>

<main class="page-shell" style="position:relative;z-index:1;">
    <div class="auth-card reveal" id="authCard">
        <a class="back-link" href="home.html">← 返回首页</a>
        <div class="auth-top">
            <div class="brand-mini">
                <div class="dot"><span></span></div>
                <strong>SuperDriver</strong>
            </div>
            <h1>欢迎回来</h1>
            <p>登录账号继续使用平台服务</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" autocomplete="tel">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-primary btn-large btn-block light-sweep">登录</button>
            </div>
        </form>

        <div class="sub-note">
            <span>还没有账号？</span><br>
            <a href="register-student.html">学员注册</a>
            <span style="margin:0 8px;">·</span>
            <a href="register-staff.html">员工注册</a>
        </div>
    </div>
</main>

<script src="../js/home.js"></script>
<script>
    function handleLogin() {
        const phone = document.getElementById('phone').value.trim();
        const pwd = document.getElementById('password').value;

        if (!phone || !pwd) {
            alert('请填写完整信息');
            return;
        }

        fetch('../login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'phone=' + encodeURIComponent(phone) + '&password=' + encodeURIComponent(pwd)
        }).then(res => res.json()).then(data => {
            if (data.code === 1) {
                alert(data.msg);
                window.location.href = data.url;
            } else {
                alert(data.msg);
            }
        }).catch(err => {
            alert('网络请求失败，请稍后重试');
        });
    }

    setTimeout(() => {
        document.getElementById('authCard').classList.add('visible');
    }, 100);
</script>
</body>
</html>
