<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SuperDriver 智慧驾培平台 - 登录">
    <title>登录 - SuperDriver 智慧驾培</title>
    <link rel="stylesheet" href="../css/auth-common.css">
    <style>
        /* ✅ 覆盖 auth-common.css 中的背景，让登录页也有极光+粒子 */
        body {
            background: #05060a;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .page-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
            z-index: 1;
        }
        .auth-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(15,23,42,0.75);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 32px 28px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
        }
        .auth-top {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-top .brand-mini {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .brand-mini .dot {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            display: grid;
            place-items: center;
            box-shadow: 0 8px 24px rgba(59,130,246,0.3);
        }
        .brand-mini .dot span {
            width: 16px;
            height: 16px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.9);
            transform: rotate(15deg);
        }
        .auth-top h1 {
            font-size: 24px;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }
        .auth-top p {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(5,6,10,0.7);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(59,130,246,0.6);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .form-group select option {
            background: #0f172a;
            color: #fff;
        }
        .btn-row {
            margin-top: 12px;
        }
        .btn-block { width: 100%; }

        .register-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }
        .register-section .title {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
            display: block;
        }
        .register-links {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .register-link-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: var(--muted);
        }
        .register-link-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(59,130,246,0.3);
            background: rgba(59,130,246,0.08);
            color: var(--text);
            box-shadow: 0 8px 25px rgba(59,130,246,0.1);
        }
        .register-link-btn .icon {
            display: block;
            font-size: 20px;
            margin-bottom: 2px;
        }
        .register-link-btn .label {
            font-size: 13px;
        }
        .register-link-btn .sub {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
        }
        .register-link-btn.student:hover {
            border-color: rgba(16,185,129,0.4);
            background: rgba(16,185,129,0.08);
        }
        .register-link-btn.staff:hover {
            border-color: rgba(139,92,246,0.4);
            background: rgba(139,92,246,0.08);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
            transition: color .2s;
            text-decoration: none;
        }
        .back-link:hover { color: var(--text); }

        #usbGroup { display: none; }

        /* ✅ 粒子+极光背景（与注册页一致） */
        .particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .aurora {
            position: fixed;
            inset: -20%;
            z-index: 0;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.45;
            mix-blend-mode: screen;
        }
        .aurora-one {
            background: radial-gradient(600px 600px at 10% 10%, rgba(59, 130, 246, 0.4), transparent 60%),
            radial-gradient(500px 500px at 90% 0%, rgba(139, 92, 246, 0.35), transparent 60%);
            animation: floatOne 24s ease-in-out infinite;
        }
        .aurora-two {
            background: radial-gradient(700px 500px at 100% 100%, rgba(16, 185, 129, 0.35), transparent 60%),
            radial-gradient(400px 400px at 0% 80%, rgba(59, 130, 246, 0.3), transparent 60%);
            animation: floatTwo 28s ease-in-out infinite;
        }
        @keyframes floatOne { 0%, 100% { transform: translate3d(0,0,0) rotate(0deg); } 50% { transform: translate3d(-2%, 3%, 0) rotate(2deg); } }
        @keyframes floatTwo { 0%, 100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(3%, -2%, 0) scale(1.05); } }
    </style>
</head>
<body>
<!-- ✅ 粒子+极光背景 -->
<canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
<div class="aurora aurora-one" aria-hidden="true"></div>
<div class="aurora aurora-two" aria-hidden="true"></div>

<main class="page-shell" style="position:relative;z-index:1;">
    <div class="auth-card reveal" id="authCard">
        <a class="back-link" href="home.html">← 返回首页</a>
        <div class="auth-top">
            <div class="brand-mini">
                <div class="dot"><span></span></div>
                <strong>SuperDriver</strong>
            </div>
            <h1>欢迎回来</h1>
            <p>登录账号继续使用平台服务</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">

            <div class="form-group">
                <label>👤 登录角色</label>
                <select id="roleSelect">
                    <option value="student">学员</option>
                    <option value="coach" selected>教练</option>
                    <option value="admin">管理员</option>
                </select>
            </div>

            <div class="form-group">
                <label>📱 手机号</label>
                <input type="text" id="phone" placeholder="请输入手机号" autocomplete="username" value="13912345678">
            </div>

            <div class="form-group">
                <label>🔒 密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" value="123456">
            </div>

            <div class="form-group" id="usbGroup">
                <label>💾 USB 安全令牌</label>
                <input type="password" id="usbToken" placeholder="输入管理员 USB 令牌 (DRIVE2026)">
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-primary btn-large btn-block light-sweep">登 录</button>
            </div>
        </form>

        <div class="register-section">
            <span class="title">还没有账号？选择角色注册</span>
            <div class="register-links">
                <a href="register-student.html" class="register-link-btn student">
                    <span class="icon">🎓</span>
                    <span class="label">学员注册</span>
                    <span class="sub">报名学车</span>
                </a>
                <a href="register-staff.html" class="register-link-btn staff">
                    <span class="icon">👔</span>
                    <span class="label">员工注册</span>
                    <span class="sub">教练 / 管理员</span>
                </a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../js/common.js"></script>
<script>
    // ✅ 粒子动画（与注册页一致）
    (function() {
        const canvas = document.getElementById('particleCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const particles = [];
        const particleCount = Math.min(60, Math.floor(width / 24));
        const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#60a5fa'];

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.r = Math.random() * 1.8 + 0.8;
                this.c = colors[Math.floor(Math.random() * colors.length)];
            }
            step() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.c;
                ctx.globalAlpha = 0.6;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.step();
                p.draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const o = particles[j];
                    const dx = p.x - o.x;
                    const dy = p.y - o.y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if (d < 140) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(o.x, o.y);
                        ctx.strokeStyle = p.c;
                        ctx.globalAlpha = 0.12 * (1 - d / 140);
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    })();

    // ===== 登录逻辑 =====
    document.getElementById('roleSelect').addEventListener('change', function() {
        var usbGroup = document.getElementById('usbGroup');
        usbGroup.style.display = (this.value === 'admin') ? 'block' : 'none';
    });

    function handleLogin() {
        var role = document.getElementById('roleSelect').value;
        var phone = document.getElementById('phone').value.trim();
        var password = document.getElementById('password').value.trim();
        var usbToken = document.getElementById('usbToken').value.trim();

        if (!phone || !password) {
            alert('请填写完整信息');
            return;
        }
        if (role === 'admin' && usbToken !== 'DRIVE2026') {
            alert('❌ USB 令牌验证失败，请插入有效令牌');
            return;
        }

        var params = new URLSearchParams();
        params.append('phone', phone);
        params.append('password', password);

        axios.post(window.BASE_URL + '/login', params.toString(), {
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        })
            .then(function(res) {
                if (res.data.code === 1) {
                    var userInfo = {
                        id: res.data.userId,
                        phone: phone,
                        role: role,
                        name: res.data.name || (role === 'coach' ? '教练' : (role === 'admin' ? '管理员' : '学员'))
                    };
                    localStorage.setItem('userInfo', JSON.stringify(userInfo));
                    window.location.href = res.data.url;
                } else {
                    alert('登录失败：' + (res.data.msg || '未知错误'));
                }
            })
            .catch(function(err) {
                alert('请求异常，请检查网络');
                console.error('登录错误:', err);
            });
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });

    setTimeout(function() {
        var card = document.getElementById('authCard');
        if (card) card.classList.add('visible');
    }, 100);
</script>
</body>
</html>
