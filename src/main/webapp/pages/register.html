<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SuperDriver 智慧驾培平台 - 注册">
    <title>注册 - SuperDriver 智慧驾培</title>
    <link rel="stylesheet" href="../css/auth-common.css">
    <style>
        .page-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .auth-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: rgba(15,23,42,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 26px 24px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            backdrop-filter: blur(18px);
        }
        .auth-top {
            text-align: center;
            margin-bottom: 18px;
        }
        .auth-top .brand-mini {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .brand-mini .dot {
            width: 30px; height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            display: grid; place-items: center;
        }
        .brand-mini .dot span {
            width: 14px; height: 14px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.85);
            transform: rotate(15deg);
        }
        .auth-top h1 {
            font-size: 22px;
            margin: 0 0 6px;
        }
        .auth-top p {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(5,6,10,0.7);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: rgba(59,130,246,0.6);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        .role-pill-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .role-pill {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            cursor: pointer;
            user-select: none;
            transition: border-color .2s, background .2s, transform .1s;
        }
        .role-pill input {
            display: none;
        }
        .role-pill.active {
            border-color: rgba(59,130,246,0.6);
            background: rgba(59,130,246,0.12);
        }
        .role-pill small {
            display: block;
            font-size: 11px;
            color: var(--muted);
        }
        .role-pill span {
            font-weight: 700;
            font-size: 14px;
        }
        .btn-row {
            margin-top: 10px;
        }
        .sub-note {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--muted);
        }
        .sub-note a {
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 10px;
        }
        .back-link:hover { color: var(--text); }
    </style>
</head>
<body>
<canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
<div class="aurora aurora-one" aria-hidden="true"></div>
<div class="aurora aurora-two" aria-hidden="true"></div>

<main class="page-shell" style="position:relative;z-index:1;">
    <div class="auth-card reveal" id="authCard">
        <a class="back-link" href="home.html">← 返回首页</a>
        <div class="auth-top">
            <div class="brand-mini">
                <div class="dot"><span></span></div>
                <strong>SuperDriver</strong>
            </div>
            <h1>注册账号</h1>
            <p>创建您的账号，开始智慧学车之旅</p>
        </div>

        <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
            <div class="role-pill-row">
                <label class="role-pill active" onclick="setRegisterType('student')">
                    <input type="radio" name="registerType" value="student" id="regTypeStudent" checked>
                    <div><span>学员注册</span><small>报名学车</small></div>
                </label>
                <label class="role-pill" onclick="setRegisterType('staff')">
                    <input type="radio" name="registerType" value="staff" id="regTypeStaff">
                    <div><span>员工注册</span><small>教练/管理员</small></div>
                </label>
            </div>

            <div class="form-group" id="regIdCardGroup">
                <label>身份证号</label>
                <input type="text" id="regIdCard" placeholder="身份证号" autocomplete="off">
            </div>

            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="regName" placeholder="请输入真实姓名" autocomplete="name">
            </div>

            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="regPhone" placeholder="请输入手机号" autocomplete="tel">
            </div>

            <div class="form-group" id="regSubjectGroup">
                <label>报考科目</label>
                <select id="regSubject">
                    <option value="C1">C1（小型手动挡）</option>
                    <option value="C2">C2（小型自动挡）</option>
                    <option value="C3">C3（低速载货）</option>
                </select>
            </div>

            <div class="form-group" id="regStaffRoleGroup" style="display:none;">
                <label>员工角色</label>
                <select id="regStaffRole">
                    <option value="coach">教练</option>
                    <option value="admin">管理员</option>
                </select>
            </div>

            <div class="form-group" id="regStaffSubjectGroup" style="display:none;">
                <label>负责科目（教练填写）</label>
                <select id="regStaffSubject">
                    <option value="C1">C1（小型手动挡）</option>
                    <option value="C2">C2（小型自动挡）</option>
                    <option value="C3">C3（低速载货）</option>
                </select>
            </div>

            <div class="form-group">
                <label>设置密码</label>
                <input type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regConfirmPassword" placeholder="再次输入密码" autocomplete="new-password">
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-primary btn-large btn-block light-sweep">立即注册</button>
            </div>
        </form>

        <div class="sub-note">
            <span>已有账号？</span>
            <a href="login.html">去登录</a>
        </div>
    </div>
</main>

<script src="../js/home.js"></script>
<script>
    function setRegisterType(type) {
        document.querySelectorAll('#registerForm .role-pill').forEach(p => p.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if (type === 'student') {
            document.getElementById('regTypeStudent').checked = true;
            document.getElementById('regIdCardGroup').style.display = 'block';
            document.getElementById('regSubjectGroup').style.display = 'block';
            document.getElementById('regStaffRoleGroup').style.display = 'none';
            document.getElementById('regStaffSubjectGroup').style.display = 'none';
        } else {
            document.getElementById('regTypeStaff').checked = true;
            document.getElementById('regIdCardGroup').style.display = 'block';
            document.getElementById('regSubjectGroup').style.display = 'none';
            document.getElementById('regStaffRoleGroup').style.display = 'block';
            updateStaffSubjectVisibility();
        }
    }

    function updateStaffSubjectVisibility() {
        const role = document.getElementById('regStaffRole').value;
        document.getElementById('regStaffSubjectGroup').style.display = role === 'coach' ? 'block' : 'none';
    }

    document.getElementById('regStaffRole').addEventListener('change', updateStaffSubjectVisibility);

    function handleRegister() {
        const registerType = document.querySelector('#registerForm input[name="registerType"]:checked').value;
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;

        if (!name || !phone || !password || !confirmPassword) {
            alert('请填写完整信息');
            return;
        }

        if (password.length < 6) {
            alert('密码至少需要 6 位');
            return;
        }

        if (password !== confirmPassword) {
            alert('两次密码输入不一致');
            return;
        }

        if (registerType === 'student') {
            const idCard = document.getElementById('regIdCard').value.trim();
            const subject = document.getElementById('regSubject').value;
            if (!idCard) {
                alert('请填写身份证号');
                return;
            }
            fetch('../register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'name=' + encodeURIComponent(name) + '&idCard=' + encodeURIComponent(idCard) +
                      '&phone=' + encodeURIComponent(phone) + '&password=' + encodeURIComponent(password) +
                      '&subject=' + encodeURIComponent(subject)
            }).then(res => res.json()).then(data => {
                if (data.code === 1) {
                    alert(data.msg);
                    window.location.href = 'login.html';
                } else {
                    alert(data.msg);
                }
            }).catch(err => {
                alert('网络请求失败，请稍后重试');
            });
        } else {
            const idCard = document.getElementById('regIdCard').value.trim();
            const role = document.getElementById('regStaffRole').value;
            const subject = document.getElementById('regStaffSubject').value;
            if (!idCard) {
                alert('请填写身份证号');
                return;
            }
            fetch('../register-staff', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'name=' + encodeURIComponent(name) +
                      '&idCard=' + encodeURIComponent(idCard) +
                      '&phone=' + encodeURIComponent(phone) +
                      '&password=' + encodeURIComponent(password) +
                      '&role=' + encodeURIComponent(role) +
                      '&subject=' + encodeURIComponent(role === 'coach' ? subject : '')
            }).then(res => res.json()).then(data => {
                if (data.code === 1) {
                    alert(data.msg);
                    window.location.href = 'login.html';
                } else {
                    alert(data.msg);
                }
            }).catch(err => {
                alert('网络请求失败，请稍后重试');
            });
        }
    }

    setTimeout(() => {
        document.getElementById('authCard').classList.add('visible');
    }, 100);
</script>
</body>
</html>
